[package]
name = "flight-computer-2026-27"
version = "0.1.0"
authors = ["tai <147849007+grepshork@users.noreply.github.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "flight-computer-2026-27"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.53", features = ["critical-section"] }
bytemuck = { version = "1", features = ["derive"] }
bme280 = "0.5.1"
anyhow = "1.0.104"
embedded-hal-bus = "0.3.0"
esp-idf-hal = "0.47.0"
qmi8658 = { git = "https://github.com/IniterWorker/qmi8658" }

[build-dependencies]
embuild = "0.33.5"
